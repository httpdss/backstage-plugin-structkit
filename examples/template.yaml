apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: structkit-example
  title: StructKit Example Template
  description: Example template demonstrating the StructKit scaffolder action
spec:
  owner: platform-team
  type: service

  parameters:
    - title: Project Information
      required:
        - name
        - description
      properties:
        name:
          title: Name
          type: string
          description: Name of the project
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Description of the project
        structureName:
          title: StructKit Structure
          type: string
          description: Name of the StructKit structure to use
          default: nextjs-app
        owner:
          title: Owner
          type: string
          description: Owner of the component
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

    - title: Repository Location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch-base
      name: Fetch Base
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}

    - id: structkit-generate
      name: Generate with StructKit
      action: structkit:generate
      input:
        structure: ${{ parameters.structureName }}
        outputPath: .
        vars:
          project_name: ${{ parameters.name }}
          description: ${{ parameters.description }}
        noHooks: true
        dryRun: false

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        allowedHosts:
          - github.com
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        repoVisibility: public

    - id: register
      name: Register Component
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
